<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>91麻豆</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#eee;font-family:system-ui,sans-serif;padding:12px;padding-bottom:50px}
h1{font-size:18px;margin-bottom:10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tab{background:#2a2a2a;color:#bbb;border:none;padding:7px 12px;border-radius:16px;font-size:13px}
.tab.active{background:#e91e63;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{background:#1c1c1c;border-radius:8px;overflow:hidden}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#222;display:block}
.card .t{font-size:12px;padding:6px 8px;line-height:1.3;height:48px;overflow:hidden}
.msg{text-align:center;padding:24px 8px;color:#aaa;font-size:13px;word-break:break-all;line-height:1.5}
.more{display:none;width:100%;margin:16px 0;padding:12px;background:#333;color:#fff;border:none;border-radius:8px}
</style>
</head>
<body>
<h1>91麻豆</h1>
<div class="tabs" id="tabs"></div>
<div id="box"><div class="msg" id="status">准备加载...</div></div>
<button class="more" id="more">加载更多</button>

<script>
(function(){
  const RAW = "http://91md.me/api.php/provide/vod/";
  // 多个代理轮询
  const PROXIES = [
    url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    url => "https://corsproxy.io/?" + encodeURIComponent(url),
    url => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url)
  ];

  let typeId = "";
  let page = 1;
  let busy = false;
  let proxyIndex = 0;

  function status(t){ document.getElementById("status") && (document.getElementById("status").textContent = t); }
  function $(id){ return document.getElementById(id); }

  async function getJson(apiPath){
    const target = RAW + apiPath;
    let lastErr = "";

    // 先试原生
    if (window.fm && fm.req){
      try{
        const r = await fm.req({url: target, method:"GET"});
        const data = typeof r === "string" ? JSON.parse(r) : (r.data ? (typeof r.data==="string"?JSON.parse(r.data):r.data) : r);
        if (data) return data;
      }catch(e){ lastErr = "fm.req: " + (e.message||e); }
    }

    // 再试代理
    for (let i=0; i<PROXIES.length; i++){
      const idx = (proxyIndex + i) % PROXIES.length;
      const proxyUrl = PROXIES[idx](target);
      try{
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        proxyIndex = idx; // 记住成功的代理
        return data;
      }catch(e){
        lastErr = "代理" + (idx+1) + ": " + (e.message||e);
      }
    }
    throw new Error(lastErr || "全部请求失败");
  }

  async function loadClass(){
    status("正在获取分类...");
    try{
      const data = await getJson("?ac=list");
      const classes = data.class || [];
      if (!classes.length) throw new Error("分类为空 code=" + data.code);

      let html = '<button class="tab active" data-id="">最新</button>';
      classes.forEach(c => {
        html += `<button class="tab" data-id="\( {c.type_id}"> \){c.type_name}</button>`;
      });
      $("tabs").innerHTML = html;
      $("tabs").onclick = e => {
        const btn = e.target.closest(".tab");
        if (!btn) return;
        $("tabs").querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        typeId = btn.dataset.id || "";
        page = 1;
        loadList(true);
      };
      return true;
    }catch(e){
      \( ("box").innerHTML = `<div class="msg">分类失败<br> \){e.message}</div>`;
      return false;
    }
  }

  async function loadList(reset){
    if (busy) return;
    busy = true;
    if (reset) $("box").innerHTML = `<div class="msg" id="status">加载列表中...</div>`;

    try{
      let path = "?ac=videolist&pg=" + page;
      if (typeId) path += "&t=" + typeId;
      const data = await getJson(path);
      const list = data.list || [];

      if (!list.length){
        \( ("box").innerHTML = `<div class="msg">没有内容<br>code= \){data.code} total=\( {data.total||0}<br> \){data.msg||""}</div>`;
        $("more").style.display = "none";
        return;
      }

      let grid = $("box").querySelector(".grid");
      if (reset || !grid){
        $("box").innerHTML = `<div class="grid"></div>`;
        grid = $("box").querySelector(".grid");
      }

      list.forEach(v => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<img src="\( {v.vod_pic||""}" loading="lazy" onerror="this.style.opacity=.3"><div class="t"> \){v.vod_name||"未知"}</div>`;
        div.onclick = () => play(v.vod_id, v.vod_name);
        grid.appendChild(div);
      });
      $("more").style.display = "block";
      page++;
    }catch(e){
      \( ("box").innerHTML = `<div class="msg">列表失败<br> \){e.message}</div>`;
    }finally{
      busy = false;
    }
  }

  async function play(id, name){
    try{
      status("获取播放地址...");
      const data = await getJson("?ac=videolist&ids=" + id);
      const vod = (data.list && data.list[0]) || {};
      const urls = (vod.vod_play_url || "").split("$$$");
      let playUrl = "";
      for (const u of urls){
        for (const ep of u.split("#")){
          const p = ep.split("$");
          if (p.length>1 && p[1].startsWith("http")){ playUrl = p[1]; break; }
        }
        if (playUrl) break;
      }
      if (!playUrl){ alert("无播放地址"); return; }

      if (window.fm && fm.play) fm.play({url: playUrl, title: name||""});
      else if (window.fm && fm.vod && fm.vod.play) fm.vod.play({url: playUrl, name: name||""});
      else location.href = playUrl;
    }catch(e){
      alert("播放失败: " + e.message);
    }
  }

  $("more").onclick = () => loadList(false);

  loadClass().then(ok => { if (ok) loadList(true); });
})();
</script>
</body>
</html>
