<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>91麻豆</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: system-ui, sans-serif; padding: 12px; }
  h1 { font-size: 20px; margin-bottom: 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tab { background: #333; color: #ccc; border: none; padding: 8px 14px; border-radius: 20px; font-size: 14px; }
  .tab.active { background: #e91e63; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .card { background: #1a1a1a; border-radius: 8px; overflow: hidden; }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #222; display: block; }
  .card .title { font-size: 13px; padding: 8px; line-height: 1.3; height: 52px; overflow: hidden; }
  .loading, .error { text-align: center; padding: 40px; color: #888; }
  .more { display: block; width: 100%; margin: 20px 0; padding: 12px; background: #333; color: #fff; border: none; border-radius: 8px; }
</style>
</head>
<body>
  <h1>91麻豆</h1>
  <div class="tabs" id="tabs"></div>
  <div id="content" class="loading">加载中...</div>
  <button class="more" id="more" style="display:none">加载更多</button>

<script>
const API = "http://91md.me/api.php/provide/vod/";
let currentType = 0;
let page = 1;
let loading = false;

async function get(url) {
  // 优先用 WebHomeTV 的原生请求（可绕过部分限制）
  if (window.fm && fm.req) {
    try {
      const res = await fm.req({ url, method: "GET" });
      return typeof res === "string" ? JSON.parse(res) : res;
    } catch (e) {}
  }
  const r = await fetch(url);
  return r.json();
}

async function loadClass() {
  try {
    const data = await get(API + "?ac=list");
    const classes = data.class || [];
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = `<button class="tab active" data-id="0">最新</button>` +
      classes.map(c => `<button class="tab" data-id="\( {c.type_id}"> \){c.type_name}</button>`).join("");
    tabs.onclick = e => {
      if (e.target.classList.contains("tab")) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        e.target.classList.add("active");
        currentType = e.target.dataset.id;
        page = 1;
        loadList(true);
      }
    };
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="error">分类加载失败<br>${e.message}</div>`;
  }
}

async function loadList(reset) {
  if (loading) return;
  loading = true;
  const content = document.getElementById("content");
  if (reset) content.innerHTML = `<div class="loading">加载中...</div>`;

  try {
    let url = API + `?ac=videolist&pg=${page}`;
    if (currentType && currentType != 0) url += `&t=${currentType}`;
    const data = await get(url);
    const list = data.list || [];
    if (reset) content.innerHTML = "";
    if (!list.length) {
      content.innerHTML = `<div class="error">没有内容</div>`;
      document.getElementById("more").style.display = "none";
      return;
    }
    const html = list.map(v => {
      const pic = v.vod_pic || "";
      const name = v.vod_name || "未知";
      const id = v.vod_id;
      return `<div class="card" data-id="${id}">
        <img src="${pic}" loading="lazy" onerror="this.style.background='#333'">
        <div class="title">${name}</div>
      </div>`;
    }).join("");
    if (reset) content.innerHTML = `<div class="grid">${html}</div>`;
    else content.querySelector(".grid").insertAdjacentHTML("beforeend", html);

    content.querySelectorAll(".card").forEach(card => {
      card.onclick = () => play(card.dataset.id);
    });
    document.getElementById("more").style.display = "block";
    page++;
  } catch (e) {
    content.innerHTML = `<div class="error">加载失败<br>${e.message}<br>请确认网络能访问 91md.me</div>`;
  } finally {
    loading = false;
  }
}

async function play(id) {
  try {
    const data = await get(API + `?ac=videolist&ids=${id}`);
    const vod = (data.list && data.list[0]) || {};
    const playFrom = (vod.vod_play_from || "").split("$$$")[0];
    const playUrl = (vod.vod_play_url || "").split("$$$")[0];
    // 取第一个播放地址
    let url = "";
    if (playUrl) {
      const parts = playUrl.split("#")[0].split("$");
      url = parts.length > 1 ? parts[1] : parts[0];
    }
    if (!url) {
      alert("没有找到播放地址");
      return;
    }
    // 优先用原生播放
    if (window.fm && fm.play) {
      fm.play({ url, title: vod.vod_name || "" });
    } else if (window.fm && fm.vod && fm.vod.play) {
      fm.vod.play({ url, name: vod.vod_name || "" });
    } else {
      // 降级：新窗口打开
      location.href = url;
    }
  } catch (e) {
    alert("获取播放地址失败: " + e.message);
  }
}

document.getElementById("more").onclick = () => loadList(false);
loadClass().then(() => loadList(true));
</script>
</body>
</html>
