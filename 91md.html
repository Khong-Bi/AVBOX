<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>91麻豆</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#111;color:#eee;font-family:system-ui,sans-serif;padding:12px;padding-bottom:40px}
  h1{font-size:18px;margin-bottom:10px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tab{background:#2a2a2a;color:#bbb;border:none;padding:7px 12px;border-radius:16px;font-size:13px}
  .tab.active{background:#e91e63;color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .card{background:#1c1c1c;border-radius:8px;overflow:hidden}
  .card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#222;display:block}
  .card .t{font-size:12px;padding:6px 8px;line-height:1.3;height:48px;overflow:hidden}
  .msg{text-align:center;padding:30px 10px;color:#999;font-size:14px;word-break:break-all}
  .more{display:none;width:100%;margin:16px 0;padding:12px;background:#333;color:#fff;border:none;border-radius:8px}
  .debug{font-size:11px;color:#666;margin-top:8px;white-space:pre-wrap}
</style>
</head>
<body>
  <h1>91麻豆</h1>
  <div class="tabs" id="tabs"></div>
  <div id="box"><div class="msg">正在加载...</div></div>
  <button class="more" id="more">加载更多</button>

<script>
(function(){
  const APIS = [
    "http://91md.me/api.php/provide/vod/",
    "https://91md.me/api.php/provide/vod/"
  ];
  let API = APIS[0];
  let typeId = "";
  let page = 1;
  let busy = false;

  function $(id){ return document.getElementById(id); }

  async function request(url){
    // 1. 优先用 WebHomeTV 原生请求
    if (window.fm && typeof fm.req === "function"){
      try{
        const r = await fm.req({url: url, method: "GET", headers: {"User-Agent":"Mozilla/5.0"}});
        if (typeof r === "string") return JSON.parse(r);
        if (r && r.data) return typeof r.data === "string" ? JSON.parse(r.data) : r.data;
        return r;
      }catch(e){}
    }
    // 2. 普通 fetch
    const res = await fetch(url, {headers:{"User-Agent":"Mozilla/5.0"}});
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function loadClass(){
    let lastErr = "";
    for (const base of APIS){
      try{
        const data = await request(base + "?ac=list");
        if (data && data.class && data.class.length){
          API = base;
          const tabs = $("tabs");
          let html = '<button class="tab active" data-id="">最新</button>';
          data.class.forEach(c=>{
            html += `<button class="tab" data-id="\( {c.type_id}"> \){c.type_name}</button>`;
          });
          tabs.innerHTML = html;
          tabs.onclick = function(e){
            const btn = e.target.closest(".tab");
            if (!btn) return;
            tabs.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
            btn.classList.add("active");
            typeId = btn.getAttribute("data-id") || "";
            page = 1;
            loadList(true);
          };
          return true;
        }
      }catch(e){
        lastErr = e.message || String(e);
      }
    }
    \( ("box").innerHTML = `<div class="msg">分类加载失败<br> \){lastErr}<div class="debug">API: ${APIS.join(" | ")}</div></div>`;
    return false;
  }

  async function loadList(reset){
    if (busy) return;
    busy = true;
    if (reset) $("box").innerHTML = `<div class="msg">加载中...</div>`;

    try{
      let url = API + "?ac=videolist&pg=" + page;
      if (typeId) url += "&t=" + typeId;

      const data = await request(url);
      const list = (data && data.list) ? data.list : [];

      if (!list.length){
        $("box").innerHTML = `<div class="msg">没有内容<br><div class="debug">url: ${url}\ncode: ${data && data.code}\nmsg: ${data && data.msg}\ntotal: ${data && data.total}</div></div>`;
        $("more").style.display = "none";
        return;
      }

      let grid = $("box").querySelector(".grid");
      if (reset || !grid){
        $("box").innerHTML = `<div class="grid"></div>`;
        grid = $("box").querySelector(".grid");
      }

      list.forEach(v=>{
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <img src="${v.vod_pic || ""}" loading="lazy" onerror="this.style.opacity=0.3">
          <div class="t">${v.vod_name || "未知"}</div>`;
        div.onclick = function(){ play(v.vod_id, v.vod_name); };
        grid.appendChild(div);
      });

      $("more").style.display = "block";
      page++;
    }catch(e){
      \( ("box").innerHTML = `<div class="msg">请求失败<br> \){e.message || e}<div class="debug">当前API: ${API}</div></div>`;
    }finally{
      busy = false;
    }
  }

  async function play(id, name){
    try{
      const data = await request(API + "?ac=detail&ids=" + id);
      let vod = (data.list && data.list[0]) || {};
      // 兼容 videolist
      if (!vod.vod_play_url){
        const d2 = await request(API + "?ac=videolist&ids=" + id);
        vod = (d2.list && d2.list[0]) || vod;
      }
      const from = (vod.vod_play_from || "").split("$$$");
      const urls = (vod.vod_play_url || "").split("$$$");
      let playUrl = "";
      for (let i=0; i<urls.length; i++){
        const eps = urls[i].split("#");
        for (const ep of eps){
          const p = ep.split("$");
          if (p.length > 1 && p[1].indexOf("http") === 0){
            playUrl = p[1];
            break;
          }
        }
        if (playUrl) break;
      }
      if (!playUrl){
        alert("未找到播放地址");
        return;
      }
      if (window.fm && fm.play){
        fm.play({url: playUrl, title: name || vod.vod_name || ""});
      } else if (window.fm && fm.vod && fm.vod.play){
        fm.vod.play({url: playUrl, name: name || ""});
      } else {
        location.href = playUrl;
      }
    }catch(e){
      alert("播放失败: " + (e.message || e));
    }
  }

  $("more").onclick = function(){ loadList(false); };

  loadClass().then(ok=>{
    if (ok) loadList(true);
  });
})();
</script>
</body>
</html>
