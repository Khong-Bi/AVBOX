<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>91麻豆</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#eee;font-family:system-ui,sans-serif;padding:12px;padding-bottom:50px}
h1{font-size:18px;margin-bottom:10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tab{background:#2a2a2a;color:#bbb;border:none;padding:7px 12px;border-radius:16px;font-size:13px}
.tab.active{background:#e91e63;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{background:#1c1c1c;border-radius:8px;overflow:hidden}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#222;display:block}
.card .t{font-size:12px;padding:6px 8px;line-height:1.3;height:48px;overflow:hidden}
.msg{text-align:center;padding:24px 8px;color:#aaa;font-size:13px;word-break:break-all;line-height:1.6}
.more{display:none;width:100%;margin:16px 0;padding:12px;background:#333;color:#fff;border:none;border-radius:8px}
</style>
</head>
<body>
<h1>91麻豆</h1>
<div class="tabs" id="tabs"></div>
<div id="box"><div class="msg" id="st">初始化...</div></div>
<button class="more" id="more">加载更多</button>

<script>
(function(){
  const RAW = "http://91md.me/api.php/provide/vod/";
  const PROXIES = [
    u => u, // 直接请求
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?" + encodeURIComponent(u)
  ];

  let typeId = "", page = 1, busy = false;

  function st(t){ var e=document.getElementById("st"); if(e) e.textContent=t; }
  function box(html){ document.getElementById("box").innerHTML=html; }
  function $(id){ return document.getElementById(id); }

  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("超时"+ms+"ms")), ms))
    ]);
  }

  async function getJson(path){
    const target = RAW + path;
    let errors = [];

    for (let i=0; i<PROXIES.length; i++){
      const url = PROXIES[i](target);
      st("尝试方式"+(i+1)+"...");
      try{
        // 原生优先
        if (i===0 && window.fm && fm.req){
          try{
            const r = await withTimeout(fm.req({url:target, method:"GET"}), 8000);
            const data = typeof r==="string" ? JSON.parse(r) : (r && r.data ? (typeof r.data==="string"?JSON.parse(r.data):r.data) : r);
            if (data && (data.list || data.class)) return data;
          }catch(e){ errors.push("fm:"+e.message); }
        }

        const res = await withTimeout(fetch(url), 10000);
        if (!res.ok) throw new Error("HTTP"+res.status);
        const data = await res.json();
        if (data && (data.list || data.class || data.code)) return data;
        throw new Error("返回异常");
      }catch(e){
        errors.push("方式"+(i+1)+":"+(e.message||e));
      }
    }
    throw new Error(errors.join(" | "));
  }

  async function loadClass(){
    st("获取分类中...");
    try{
      const data = await getJson("?ac=list");
      const classes = data.class || [];
      if (!classes.length) throw new Error("分类空 code="+data.code);

      let html = '<button class="tab active" data-id="">最新</button>';
      classes.forEach(c=>{
        html += '<button class="tab" data-id="'+c.type_id+'">'+c.type_name+'</button>';
      });
      $("tabs").innerHTML = html;
      $("tabs").onclick = function(e){
        var btn = e.target.closest(".tab");
        if (!btn) return;
        $("tabs").querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});
        btn.classList.add("active");
        typeId = btn.getAttribute("data-id") || "";
        page = 1;
        loadList(true);
      };
      return true;
    }catch(e){
      box('<div class="msg">分类失败<br>'+e.message+'</div>');
      return false;
    }
  }

  async function loadList(reset){
    if (busy) return;
    busy = true;
    if (reset) box('<div class="msg" id="st">加载列表...</div>');

    try{
      var path = "?ac=videolist&pg="+page;
      if (typeId) path += "&t="+typeId;
      const data = await getJson(path);
      const list = data.list || [];

      if (!list.length){
        box('<div class="msg">没有内容<br>code='+data.code+' total='+(data.total||0)+'</div>');
        $("more").style.display = "none";
        return;
      }

      var grid = $("box").querySelector(".grid");
      if (reset || !grid){
        box('<div class="grid"></div>');
        grid = $("box").querySelector(".grid");
      }

      list.forEach(function(v){
        var div = document.createElement("div");
        div.className = "card";
        div.innerHTML = '<img src="'+(v.vod_pic||'')+'" loading="lazy" onerror="this.style.opacity=.3"><div class="t">'+(v.vod_name||'未知')+'</div>';
        div.onclick = function(){ play(v.vod_id, v.vod_name); };
        grid.appendChild(div);
      });
      $("more").style.display = "block";
      page++;
    }catch(e){
      box('<div class="msg">列表失败<br>'+e.message+'</div>');
    }finally{
      busy = false;
    }
  }

  async function play(id, name){
    try{
      st("获取播放地址...");
      const data = await getJson("?ac=videolist&ids="+id);
      var vod = (data.list && data.list[0]) || {};
      var urls = (vod.vod_play_url || "").split("$$$");
      var playUrl = "";
      for (var i=0;i<urls.length;i++){
        var eps = urls[i].split("#");
        for (var j=0;j<eps.length;j++){
          var p = eps[j].split("$");
          if (p.length>1 && p[1].indexOf("http")===0){ playUrl=p[1]; break; }
        }
        if (playUrl) break;
      }
      if (!playUrl){ alert("无播放地址"); return; }

      if (window.fm && fm.play) fm.play({url:playUrl, title:name||""});
      else if (window.fm && fm.vod && fm.vod.play) fm.vod.play({url:playUrl, name:name||""});
      else location.href = playUrl;
    }catch(e){
      alert("播放失败: "+e.message);
    }
  }

  $("more").onclick = function(){ loadList(false); };

  st("开始请求...");
  loadClass().then(function(ok){ if(ok) loadList(true); });
})();
</script>
</body>
</html>
